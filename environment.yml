# Conda environment for the cervical cancer risk prediction project.
#
# Create with:   conda env create -f environment.yml
# Activate with: conda activate ds_research
# Update with:   conda env update --file environment.yml --prune
#
# Versions are pinned to a verified working environment (macOS arm64,
# Python 3.11.14). Only direct dependencies are listed so the file solves on
# Linux and Windows too; conda resolves the transitive dependencies.

name: ds_research

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  # Core scientific stack
  - numpy=2.4.6
  - pandas=3.0.5
  - scipy=1.17.1
  - scikit-learn=1.9.0
  - statsmodels=0.15.0
  # Class imbalance handling (SMOTE)
  - imbalanced-learn=0.14.2
  # Visualisation
  - matplotlib=3.11.1
  - seaborn=0.13.2
  # Notebook environment
  - jupyter=1.1.1
  - jupyterlab=4.6.3
  - ipykernel=7.3.0
  # Testing
  - pytest=9.1.1
  # Deep learning - installed via pip (not on the default conda channels)
  - pip
  - pip:
      - tensorflow==2.21.0
